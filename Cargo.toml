[package]
name = "pixelmap-py"
version = "0.2.0"
edition = "2021"
rust-version = "1.83"
description = "Python bindings for the pixelmap crate"
license = "MIT"
# The distribution goes to PyPI, not crates.io. The name here only has to avoid
# clashing with the `pixelmap` dependency below; the name users see is set in
# pyproject.toml.
publish = false

[lib]
name = "_pixelmap"
crate-type = ["cdylib"]

[dependencies]
pixelmap = "0.2"
pyo3 = { version = "0.29", features = ["abi3-py39", "extension-module"] }
numpy = "0.29"

[profile.release]
# This repo is its own workspace root, so it does not inherit the crate's tuned
# release profile. Without these the solver's hot path loses cross-crate inlining.
lto = "fat"
codegen-units = 1
